name: platform-api

on:
  push:
    branches: [main]
    paths:
      - examples/platform/app/**
      - .github/workflows/platform-api.yaml
  pull_request:
    paths:
      - examples/platform/app/**
      - .github/workflows/platform-api.yaml

permissions:
  contents: read

# one run per ref: a newer push to main cancels the older run, so an older digest can never
# land in the deploy PR after a newer one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: examples/platform/app

jobs:
  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the history, not just the last commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/platform/app/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # the image is built once, here: e2e tests these bytes and push ships them
  build:
    needs: [secrets, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t api:ci .

      - name: Trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: examples/platform/app
          severity: CRITICAL,HIGH
          exit-code: "1"

      - run: docker save -o ${{ runner.temp }}/api.tar api:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image
          path: ${{ runner.temp }}/api.tar
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image
          path: ${{ runner.temp }}
      - run: docker load -i ${{ runner.temp }}/api.tar

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ci
      - run: kind load docker-image api:ci --name ci

      - name: Deploy the kind overlay
        working-directory: examples/platform/gitops/workloads/api/overlays/kind
        run: |
          # the overlay carries Gateway API, prometheus-operator and Cilium objects, a bare kind cluster has none of their CRDs
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml
          kubectl apply --server-side \
            -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.85.0/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml \
            -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.85.0/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml \
            -f https://raw.githubusercontent.com/cilium/cilium/v1.18.2/pkg/k8s/apis/cilium.io/client/crds/v2/ciliumnetworkpolicies.yaml
          kubectl create namespace api --dry-run=client -o yaml | kubectl apply -f -
          kustomize edit set image api=api:ci
          kubectl apply -k .
          kubectl -n api rollout status deploy/api --timeout=120s

      - name: Smoke test /readyz
        run: |
          kubectl -n api port-forward deploy/api 8080:8080 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8080/readyz

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n api get pods,events
          kubectl -n api logs deploy/api --tail=100

  push:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: europe-west3-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/apps/api
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image
          path: ${{ runner.temp }}
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: europe-west3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      # the tested image, retagged; nothing is rebuilt
      - id: push
        working-directory: .
        run: |
          docker load -i ${{ runner.temp }}/api.tar
          docker tag api:ci "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

  sign:
    needs: push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # Fulcio cert for cosign, and the WIF exchange
    env:
      IMAGE: europe-west3-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/apps/api@${{ needs.push.outputs.digest }}
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: europe-west3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign and attest by digest
        working-directory: .
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE"

  # GKE follows env/gke, so the PR targets it and merging it is the deploy.
  # It is opened with GITHUB_TOKEN, so no workflow runs on it; checks on deploy PRs need a PAT or GitHub App token.
  deliver:
    needs: [push, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      IMAGE: europe-west3-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/apps/api
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: env/gke

      - name: Pin the digest
        working-directory: examples/platform/gitops/workloads/api/overlays/gke
        run: |
          kustomize edit set image "api=${IMAGE}@${DIGEST}"
          git diff

      # one branch, so a newer build updates the open PR instead of opening another.
      # Needs "Allow GitHub Actions to create and approve pull requests" in the repo settings.
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: env/gke
          branch: deploy/api-gke
          add-paths: examples/platform/gitops/**
          commit-message: "chore(api): deploy ${{ needs.push.outputs.digest }}"
          title: "api: deploy ${{ github.sha }} to gke"
          body: |
            Image: `${{ env.IMAGE }}@${{ env.DIGEST }}`
            Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Scanned with Trivy before push, tested on kind, signed with cosign, SBOM attested.
          labels: deploy
