// 🌩 Go++ 🌩 #34 · gRPC: Schema evolution
syntax = "proto3";

package order.v1;

service OrderService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  // Not: rpc CancelOrder(GetOrderRequest) returns (google.protobuf.Empty);
}

message Order {
  reserved 3;
  reserved "quantity";
  // Not: string note = 3;

  string id = 1;
  string item = 2;
  // Not: int64 item = 2;
  Status status = 4;
  repeated LineItem items = 5;
}

message LineItem {
  string sku = 1;
  int32 quantity = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  // Not: STATUS_PENDING = 0;
  STATUS_PENDING = 1;
  STATUS_SHIPPED = 2;
  STATUS_CANCELLED = 3;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string id = 1;
}

message CancelOrderResponse {}
