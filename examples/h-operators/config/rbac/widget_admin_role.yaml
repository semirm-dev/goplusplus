# This rule is not used by the project widget-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over goplusplus.semirmahovkic.xyz.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: widget-operator
    app.kubernetes.io/managed-by: kustomize
  name: widget-admin-role
rules:
- apiGroups:
  - goplusplus.semirmahovkic.xyz
  resources:
  - widgets
  verbs:
  - '*'
- apiGroups:
  - goplusplus.semirmahovkic.xyz
  resources:
  - widgets/status
  verbs:
  - get
