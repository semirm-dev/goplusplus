apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - { key: env, operator: In, values: [kind, gke] }
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "api-{{.metadata.labels.env}}"
    spec:
      project: api
      source:
        repoURL: https://github.com/semirm-dev/platform-gitops.git
        targetRevision: main
        path: "workloads/api/overlays/{{.metadata.labels.env}}"
      destination:
        server: "{{.server}}"
        namespace: api
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
