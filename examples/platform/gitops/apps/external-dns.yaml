# GKE only: on kind the Gateway address is private and useless in public DNS
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            env: gke
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "external-dns-{{.metadata.labels.env}}"
    spec:
      project: platform
      sources:
        - repoURL: https://kubernetes-sigs.github.io/external-dns
          chart: external-dns
          targetRevision: 1.19.0
          helm:
            valueFiles:
              - $values/platform/external-dns/values.yaml
        - repoURL: https://github.com/semirm-dev/platform-gitops.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/semirm-dev/platform-gitops.git
          targetRevision: main
          path: platform/external-dns
          directory:
            exclude: values.yaml
      destination:
        server: "{{.server}}"
        namespace: external-dns
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
        retry:
          limit: 5
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
