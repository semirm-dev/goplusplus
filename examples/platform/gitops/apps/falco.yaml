apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: 6.4.0
      helm:
        valueFiles:
          - $values/platform/falco/values.yaml
    - repoURL: https://github.com/semirm-dev/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/semirm-dev/platform-gitops.git
      targetRevision: main
      path: platform/falco
      directory:
        exclude: values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
