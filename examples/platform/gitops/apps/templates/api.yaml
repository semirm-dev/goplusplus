{{- if .Values.tracks.api }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: api
  source:
    repoURL: "{{ .Values.repoURL }}"
    targetRevision: "{{ .Values.targetRevision }}"
    path: {{ .Values.basePath }}/workloads/api/overlays/{{ .Values.env }}
  destination:
    server: https://kubernetes.default.svc
    namespace: api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # lets the api's HTTPRoute attach to the public Gateway
    managedNamespaceMetadata:
      labels:
        public-gateway: "true"
{{- end }}
