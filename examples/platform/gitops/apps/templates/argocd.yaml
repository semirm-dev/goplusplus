# Argo CD manages itself. The name matches the Helm release from bootstrap,
# so Argo adopts that install. No resources-finalizer and no prune, so a bad
# commit or a deleted app can't uninstall Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: bootstrap
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 8.5.8
      helm:
        valueFiles:
          - $values/{{ .Values.basePath }}/platform/argocd/values.yaml
          - $values/{{ .Values.basePath }}/clusters/{{ .Values.env }}/argocd.yaml
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.targetRevision }}"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- if .Values.tracks.secrets }}
---
# The Dex secret is its own app: the ExternalSecret CRD arrives in wave 0, after
# Argo CD's wave -1, and a failed sync there would stall root at wave -1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bootstrap
  source:
    repoURL: "{{ .Values.repoURL }}"
    targetRevision: "{{ .Values.targetRevision }}"
    path: {{ .Values.basePath }}/platform/argocd
    directory:
      exclude: values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
