apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.targetRevision }}"
      path: platform/gateway
    # the Gateway differs per cluster only in its gatewayClassName
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.targetRevision }}"
      path: clusters/{{ .Values.env }}
      directory:
        include: gateway.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
