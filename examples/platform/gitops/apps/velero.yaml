# GKE only: it reaches GCS through Workload Identity
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            env: gke
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "velero-{{.metadata.labels.env}}"
    spec:
      project: platform
      sources:
        - repoURL: https://vmware-tanzu.github.io/helm-charts
          chart: velero
          targetRevision: 10.0.0
          helm:
            valueFiles:
              - $values/platform/velero/values.yaml
        - repoURL: https://github.com/semirm-dev/platform-gitops.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/semirm-dev/platform-gitops.git
          targetRevision: main
          path: platform/velero
          directory:
            exclude: values.yaml
      destination:
        server: "{{.server}}"
        namespace: velero
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
        retry:
          limit: 5
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
