# No resources-finalizer here: deleting root must not uninstall the platform
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/semirm-dev/goplusplus.git
    # GKE follows env/gke, kind follows main. Promote by fast-forwarding env/gke
    # to a commit already green on kind.
    targetRevision: env/gke
    path: examples/platform/gitops/apps
    helm:
      valueFiles:
        - values-gke.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
