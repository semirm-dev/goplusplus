apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    # plain HTTP on kind only, so the route works before S2 issues the certificate
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              public-gateway: "true"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-example-com-tls
      # only labelled namespaces may claim a *.example.com hostname
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              public-gateway: "true"
