# A private CA for in-cluster TLS. The self-signed issuer signs only the CA below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-internal-ca
  namespace: cert-manager   # a ClusterIssuer reads its CA secret from here
spec:
  isCA: true
  commonName: platform-internal-ca
  secretName: platform-internal-ca
  duration: 87600h   # outlives every leaf it signs
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-internal-ca
spec:
  ca:
    secretName: platform-internal-ca
