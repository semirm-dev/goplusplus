apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcosidekick-slack
  namespace: falco
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: falcosidekick-slack
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOKURL
      remoteRef:
        key: falco
        property: slack-webhook-url
