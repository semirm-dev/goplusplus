apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-example-com
  namespace: gateway
spec:
  secretName: wildcard-example-com-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging   # flip to letsencrypt-prod once READY=True
  dnsNames:
    - example.com
    - "*.example.com"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
