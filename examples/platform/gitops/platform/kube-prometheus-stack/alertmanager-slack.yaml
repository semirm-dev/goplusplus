apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: alertmanager
        property: slack-webhook-url
