apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform tools from goplusplus/examples/platform/gitops
  sourceRepos:
    - https://github.com/semirm-dev/goplusplus.git
    - https://openbao.github.io/openbao-helm
    - https://charts.external-secrets.io
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://kyverno.github.io/kyverno
    - https://aquasecurity.github.io/helm-charts
    - https://falcosecurity.github.io/charts
    - https://vmware-tanzu.github.io/helm-charts
  destinations:
    - { server: https://kubernetes.default.svc, namespace: openbao }
    - { server: https://kubernetes.default.svc, namespace: external-secrets }
    - { server: https://kubernetes.default.svc, namespace: cert-manager }
    - { server: https://kubernetes.default.svc, namespace: external-dns }
    - { server: https://kubernetes.default.svc, namespace: gateway }
    - { server: https://kubernetes.default.svc, namespace: monitoring }
    - { server: https://kubernetes.default.svc, namespace: kyverno }
    - { server: https://kubernetes.default.svc, namespace: trivy-system }
    - { server: https://kubernetes.default.svc, namespace: falco }
    - { server: https://kubernetes.default.svc, namespace: velero }
    # kube-prometheus-stack puts its CoreDNS/kubelet scrape Services here
    - { server: https://kubernetes.default.svc, namespace: kube-system }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
    - { group: cert-manager.io, kind: ClusterIssuer }
    - { group: external-secrets.io, kind: ClusterSecretStore }
    - { group: kyverno.io, kind: ClusterPolicy }
    - { group: aquasecurity.github.io, kind: ClusterComplianceReport }
