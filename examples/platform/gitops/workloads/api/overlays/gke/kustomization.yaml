apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - allow-from-gateway.yaml
  - healthcheckpolicy.yaml
patches:
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
images:
  - name: api
    newName: europe-west3-docker.pkg.dev/floci-local/apps/api
    digest: sha256:4f1c0c5e9a8b7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e
