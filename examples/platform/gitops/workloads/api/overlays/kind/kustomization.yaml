apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - allow-from-gateway.yaml
patches:
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  # with one replica a PDB would only block node drains
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: api
        namespace: api
  # Cilium's Envoy proxies from an address in the pod CIDR (kind's default 10.244.0.0/16)
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - { name: TRUSTED_PROXIES, value: "10.244.0.0/16" }
# docker build -t api:dev . && kind load docker-image api:dev --name platform
images:
  - name: api
    newTag: dev
